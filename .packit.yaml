  # ===== EGG TESTS - 3 CONFIGURATIONS (RHEL 8/9/10 × x86_64) =====

  # Egg Test 1: RHEL 8 × x86_64
  # No insights-core RPM exists on RHEL 8 (egg delivery only) and no Copr
  # build is needed: the egg is built on the guest from the PR source
  # (PACKIT_SOURCE_URL/PACKIT_SOURCE_SHA) by tests/egg-test/test.sh.
  - job: tests
    trigger: pull_request
    identifier: "egg-test-rhel8-x86_64"
    fmf_url: "https://gitlab.cee.redhat.com/insights-foundations/insights-core-test"
    fmf_ref: "packit-migration"
    use_internal_tf: true
    skip_build: true
    targets:
      rhel-8-x86_64:
        distros: [RHEL-8.10.0-Nightly]
    tf_extra_params:
      test:
        tmt:
          test_filter: 'tag:egg'

  # Egg Test 2: RHEL 9 × x86_64
  # RHEL 9.7 predates the insights-core RPM (introduced in 9.8), so the
  # suite runs against the egg built from the PR source - no Copr build
  # and no RPM artifact on the guest.
  - job: tests
    trigger: pull_request
    identifier: "egg-test-rhel9-x86_64"
    fmf_url: "https://gitlab.cee.redhat.com/insights-foundations/insights-core-test"
    fmf_ref: "packit-migration"
    use_internal_tf: true
    skip_build: true
    targets:
      rhel-9-x86_64:
        distros: [RHEL-9.7.0-Nightly]
    tf_extra_params:
      test:
        tmt:
          test_filter: 'tag:egg'

  # Egg Test 3: RHEL 10 × x86_64
  # RHEL 10.0 predates the insights-core RPM (introduced in 10.2), so the
  # suite runs against the egg built from the PR source - no Copr build
  # and no RPM artifact on the guest.
  - job: tests
